{{- /* One Job per run. The scalability sweep renders `indexed` instead: 141 Jobs would be 141 run
     lists in values.yaml, and nothing would cap how many run at once. */}}
{{- range .Values.runs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Values.experiment }}-{{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    experiment: {{ $.Values.experiment }}
    scenario: {{ .scenario }}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        experiment: {{ $.Values.experiment }}
        scenario: {{ .scenario }}
    spec:
      restartPolicy: Never
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: run
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: EXPERIMENT
              value: "{{ $.Values.experiment }}"
            - name: DATASET
              value: "{{ $.Values.dataset }}"
            - name: N_FOLDS
              value: "{{ $.Values.nFolds }}"
            - name: SCENARIO
              value: "{{ .scenario }}"
            - name: ERROR_RATE
              value: "{{ .errorRate }}"
            - name: SEED
              value: "{{ .seed }}"
            - name: RESULTS_DIR
              value: "{{ $.Values.results.mountPath }}"
            {{- with $.Values.data }}
            - name: DATA_DIR
              value: "{{ .mountPath }}"
            {{- end }}
            - name: LLM_URL
              value: "{{ $.Values.llm.url }}"
            - name: LLM_MODEL
              value: "{{ $.Values.llm.model }}"
            - name: LLM_N_JOBS
              value: "{{ $.Values.llm.nJobs }}"
            - name: LLM_PROVIDER
              value: "{{ $.Values.llm.provider }}"
            {{- with $.Values.polarsMaxThreads }}
            # Polars counts the node's cores, not the cgroup's: 256 threads inside a 4-CPU limit is
            # oversubscription, and oversubscription is noise in every number this experiment reports.
            - name: POLARS_MAX_THREADS
              value: "{{ . }}"
            {{- end }}
            {{- range $name, $value := .env }}
            - name: {{ $name }}
              value: "{{ $value }}"
            {{- end }}
            {{- with $.Values.llm.apiKeySecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
          volumeMounts:
            - name: results
              mountPath: {{ $.Values.results.mountPath }}
            {{- with $.Values.data }}
            - name: data
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml (.resources | default $.Values.resources) | nindent 12 }}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: {{ $.Values.results.pvc }}
        {{- with $.Values.data }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .pvc }}
            readOnly: true
        {{- end }}
{{- end }}
